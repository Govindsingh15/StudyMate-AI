services:
  - type: web
    name: studymate-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_MODEL
        value: gemini-3.6-flash
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "false"
